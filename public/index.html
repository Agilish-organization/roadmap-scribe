<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roadmap Scribe — MVP</title>
<style>
  :root { --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a; --text: #e1e4ed; --muted: #8b8fa3; --accent: #6c5ce7; --green: #00d2a0; --orange: #f5a623; --red: #e74c3c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }
  .sidebar { width: 320px; background: var(--surface); border-right: 1px solid var(--border); padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .sidebar h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .sidebar .subtitle { font-size: 12px; color: var(--muted); }
  textarea { flex: 1; width: 100%; min-height: 280px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 14px; font-size: 13px; line-height: 1.6; resize: vertical; font-family: inherit; }
  textarea:focus { outline: none; border-color: var(--accent); }
  button { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .15s; }
  button:hover { opacity: .9; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .main { flex: 1; padding: 24px; overflow-y: auto; }
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  .tab { padding: 8px 20px; border-radius: 6px 6px 0 0; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--muted); background: transparent; border: none; }
  .tab.active { color: var(--text); background: var(--surface); }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 80px 0; }
  .roadmap-initiative { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
  .roadmap-initiative .theme { font-weight: 700; font-size: 15px; }
  .roadmap-initiative .timeline { font-size: 12px; color: var(--accent); margin: 4px 0; }
  .roadmap-initiative .desc { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .summary-box { background: var(--surface); border-left: 3px solid var(--accent); border-radius: 6px; padding: 14px 18px; margin-bottom: 20px; font-size: 13px; color: var(--muted); }
  .ticket { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; display: flex; gap: 14px; align-items: flex-start; }
  .ticket-type { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
  .ticket-type.epic { background: rgba(108,92,231,.2); color: var(--accent); }
  .ticket-type.story { background: rgba(0,210,160,.2); color: var(--green); }
  .ticket-type.task { background: rgba(245,166,35,.2); color: var(--orange); }
  .ticket-type.bug { background: rgba(231,76,60,.2); color: var(--red); }
  .ticket-priority { font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
  .ticket-priority.high { background: rgba(231,76,60,.15); color: var(--red); }
  .ticket-priority.medium { background: rgba(245,166,35,.15); color: var(--orange); }
  .ticket-priority.low { background: rgba(139,143,163,.15); color: var(--muted); }
  .ticket-body { flex: 1; }
  .ticket-summary { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .ticket-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .ticket-key { font-size: 11px; color: var(--muted); font-family: monospace; }
  .error { background: rgba(231,76,60,.1); border: 1px solid rgba(231,76,60,.3); border-radius: 8px; padding: 16px; color: var(--red); font-size: 13px; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; margin-right: 8px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="sidebar">
  <div>
    <h1>🛣️ Roadmap Scribe</h1>
    <p class="subtitle">MVP — paste a meeting transcript and generate a roadmap + Jira tickets</p>
  </div>
  <textarea id="transcript" placeholder="Paste your meeting transcript here (at least 50 characters)..."></textarea>
  <button id="generateBtn" onclick="generate()">Generate</button>
  <div class="subtitle" style="text-align:center;margin-top:8px;">Powered by AI · OpenRouter</div>
</div>
<div class="main">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('roadmap')">📋 Roadmap</button>
    <button class="tab" onclick="switchTab('tickets')">🎫 Tickets</button>
    <button class="tab" onclick="switchTab('raw')">🔧 Raw JSON</button>
  </div>
  <div id="output"><div class="empty">Paste a transcript and click Generate →</div></div>
</div>

<script>
let lastResult = null;
let currentTab = 'roadmap';

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab:nth-child(${tab === 'roadmap' ? 1 : tab === 'tickets' ? 2 : 3})`).classList.add('active');
  render();
}

async function generate() {
  const transcript = document.getElementById('transcript').value;
  const btn = document.getElementById('generateBtn');
  const output = document.getElementById('output');

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Generating...';
  lastResult = null;

  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transcript }),
    });
    const data = await res.json();
    if (!res.ok) {
      output.innerHTML = `<div class="error">${escapeHtml(data.error || 'Unknown error')}</div>`;
      return;
    }
    lastResult = data;
  } catch (err) {
    output.innerHTML = `<div class="error">Network error: ${escapeHtml(err.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Generate';
  }
  render();
}

function render() {
  const output = document.getElementById('output');
  if (!lastResult) return;

  if (currentTab === 'roadmap') {
    output.innerHTML = renderRoadmap(lastResult.roadmap);
  } else if (currentTab === 'tickets') {
    output.innerHTML = renderTickets(lastResult.tickets);
  } else {
    output.innerHTML = `<pre style="background:var(--surface);border-radius:8px;padding:16px;font-size:12px;overflow:auto;color:var(--green);">${escapeHtml(JSON.stringify(lastResult, null, 2))}</pre>`;
  }
}

function renderRoadmap(roadmap) {
  let html = '';
  if (roadmap.summary) {
    html += `<div class="summary-box">📝 ${escapeHtml(roadmap.summary)}</div>`;
  }
  if (roadmap.initiatives && roadmap.initiatives.length) {
    roadmap.initiatives.forEach(i => {
      html += `<div class="roadmap-initiative">
        <div class="theme">${escapeHtml(i.theme)}</div>
        <div class="timeline">⏱ ${escapeHtml(i.timeline)}</div>
        <div class="desc">${escapeHtml(i.description)}</div>
      </div>`;
    });
  } else {
    html += '<div class="empty">No initiatives found</div>';
  }
  return html;
}

function renderTickets(tickets) {
  if (!tickets || !tickets.length) return '<div class="empty">No tickets generated</div>';
  return tickets.map(t => `
    <div class="ticket">
      <div>
        <span class="ticket-type ${t.type.toLowerCase()}">${escapeHtml(t.type)}</span>
        <div class="ticket-key" style="margin-top:6px;">${escapeHtml(t.key)}</div>
        <span class="ticket-priority ${t.priority.toLowerCase()}" style="display:inline-block;margin-top:4px;">${escapeHtml(t.priority)}</span>
      </div>
      <div class="ticket-body">
        <div class="ticket-summary">${escapeHtml(t.summary)}</div>
        <div class="ticket-desc">${escapeHtml(t.description)}</div>
      </div>
    </div>
  `).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
